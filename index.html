      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",

          "browserRequirements": "Requires modern JavaScript-enabled browser",

            "@type": "Offer",
            "price": "0",

          },

            "Whitespace and line cleanup",
            "Duplicate line removal",
            "Case conversion (UPPER, lower, Title, Sentence)",
            "Emoji and special character removal",

            "Instant text statistics (words, characters, reading time)",

            "Installable Progressive Web App (PWA)"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://textcleanupstudio.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Is my text uploaded or stored on any server?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Text Cleanup Studio processes 100% of your text directly in your web browser. No text data ever leaves your device or is sent over any network."
              }
            },
            {
              "@type": "Question",
              "name": "Can I install Text Cleanup Studio as an app?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. As a Progressive Web App (PWA), you can install Text Cleanup Studio directly to your device desktop or home screen for quick access."
              }
            },
            {
              "@type": "Question",
              "name": "How does duplicate line removal treat blank lines?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You can configure whether blank lines are ignored or deduplicated. By default, duplicate non-empty lines are eliminated while preserving their first occurrence order."
              }
            },
            {
              "@type": "Question",
              "name": "How are custom presets saved?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Custom cleanup rules and presets are saved securely in your browser's localStorage. They remain strictly on your local device."
              }
            }
          ]
        }
      ]
    }
